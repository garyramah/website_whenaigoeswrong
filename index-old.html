<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>When AI Goes Wrong</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #38bdf8;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, var(--bg), #1f2937);
        color: var(--text);
      }

      .card {
        width: min(90vw, 720px);
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 18px;
        padding: 48px 32px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 5vw, 3.5rem);
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
        font-size: 1.05rem;
      }

      .tag {
        display: inline-block;
        margin-top: 20px;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(56, 189, 248, 0.12);
        border: 1px solid rgba(56, 189, 248, 0.4);
        color: var(--accent);
        font-weight: bold;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        font-size: 0.75rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>When AI Goes Wrong</h1>
      <p>
        A minimal landing page for the project. This is a clean starting point for
        further content, branding, and product messaging.
      </p>
      <div class="tag">Minimal Index</div>
    </main>
  </body>
</html>
